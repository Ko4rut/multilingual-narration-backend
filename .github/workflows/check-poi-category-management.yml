name: Check POI Category Management

on:
  push:
    branches: [feature/poi-category-management-api]
  pull_request:
    paths:
      - "app/domains/catalog/**"
      - "app/domains/poi/models/poi_category_mapping.py"
      - "alembic/versions/0012_poi_category_constraints.py"
      - "scripts/seed.py"
      - "tests/test_catalog_category_*.py"
      - ".github/workflows/check-poi-category-management.yml"

permissions:
  contents: read

jobs:
  category-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
      JWT_ACTIVE_KEY_ID: test
      JWT_ISSUER: test
      JWT_AUDIENCE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app/domains/catalog app/domains/poi/models/poi_category_mapping.py
      - run: python -m pytest -q -p no:cacheprovider tests/test_catalog_category_schemas.py tests/test_catalog_category_service.py tests/test_catalog_category_api.py tests/test_catalog_api.py tests/test_catalog_repositories.py tests/test_migration.py

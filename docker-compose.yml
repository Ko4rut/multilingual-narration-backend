x-backend: &backend
  image: mnr-backend:local
  build:
    context: .
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-narration_app}:${POSTGRES_PASSWORD:-narration_dev_password}@postgres:5432/${POSTGRES_DB:-narration_db}
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    JWT_PUBLIC_KEYS: "${JWT_PUBLIC_KEYS:-{}}"
    JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-auth-key-1}
    JWT_ISSUER: ${JWT_ISSUER:-mnr-backend}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-mnr-admin-web}
    JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
    ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
    REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
    AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-refresh_token}
    AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/api/v1/identity}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-strict}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narration_db}
      POSTGRES_USER: ${POSTGRES_USER:-narration_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narration_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *backend
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && alembic check && python -m scripts.seed",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
